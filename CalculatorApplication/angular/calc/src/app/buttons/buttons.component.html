<div id="buttons" (click) = "sendNumToDisplay($event)">
    <button id = "C" (click)="click$.next($event)">C</button>
    <button id = "CE" (click)="buttonClicked($event)">CE</button>
    <button id = "%" (click)="buttonClicked($event)">%</button>
    <button id = "√" (click)="buttonClicked($event)">√</button>
    <button id = "7" (click)="buttonClicked($event)">7</button>
    <button id = "8" (click)="buttonClicked($event)">8</button>
    <button id = "9" (click)="buttonClicked($event)">9</button>
    <button id = "÷" (click)="buttonClicked($event)">÷</button>
    <button id = "4" (click)="buttonClicked($event)">4</button>
    <button id = "5" (click)="buttonClicked($event)">5</button>
    <button id = "6" (click)="buttonClicked($event)">6</button>
    <button id = "×" (click)="buttonClicked($event)">×</button>
    <button id = "1" (click)="buttonClicked($event)">1</button>
    <button id = "2" (click)="buttonClicked($event)">2</button>
    <button id = "3" (click)="buttonClicked($event)">3</button>
    <button id = "–" (click)="buttonClicked($event)">–</button>
    <button id = "0" (click)="buttonClicked($event)">0</button>
    <button id = "●" (click)="buttonClicked($event)">●</button>
    <button id = "=" (click)="buttonClicked($event)">=</button>
    <button id = "+" (click)="buttonClicked($event)">+</button>
</div>
