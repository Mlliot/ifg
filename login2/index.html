<!DOCTYPE html>
<html>
    <head>
        <title>Login Page</title>
        <script src="script.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <img src="img/logo-large.png" height="128">
        </header>
        <div id="container">
            <form action="" id="login_form">
                Please Login Below
                <br><br>
                <input type="username" id="username" placeholder="username">
                <input type="text" id="password" placeholder="password">
                <div id="button_wrapper"><button id="submit_button" type="submit">Submit</button></div>
            </form>
        </div>
        <footer>
            <img src="img/logo-small.png" width="64" height="64">
            <p>Elliot Simmons, 2025</p>
        </footer>
    </body>
</html>
